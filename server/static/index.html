<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/static/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#0a0e14">
<meta name="description" content="Distributed video transcoding for a mixed-hardware homelab.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Chivo+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0e14;
    --ink-2:#111722;
    --glass:rgba(255,255,255,.055);
    --edge:rgba(255,255,255,.11);
    --text:#e8edf5;
    --muted:#7f8ea6;
    --signal:#4ade9b;   /* encoding, healthy */
    --amber:#f2b03d;    /* queued, waiting */
    --fault:#ff6b6b;    /* failed */
    --idle:#5b6b85;
    --r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(120% 80% at 12% -10%, #1a2740 0%, transparent 55%),
      radial-gradient(100% 70% at 100% 0%, #16283a 0%, transparent 50%),
      var(--ink);
    color:var(--text);
    font-family:Archivo,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:22px 18px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto}

  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:26px}
  h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
  .tag{font-family:'Chivo Mono',monospace;font-size:11px;letter-spacing:.14em;
       text-transform:uppercase;color:var(--muted)}
  .pill{margin-left:auto;display:flex;align-items:center;gap:7px;
        font-family:'Chivo Mono',monospace;font-size:11px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--fault);
       transition:background .3s}
  .dot.live{background:var(--signal);box-shadow:0 0 10px var(--signal)}

  .glass{
    background:var(--glass);
    border:1px solid var(--edge);
    border-radius:var(--r);
    backdrop-filter:blur(22px) saturate(150%);
    -webkit-backdrop-filter:blur(22px) saturate(150%);
  }

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
         gap:12px;margin-bottom:24px}
  .stat{padding:16px 18px}
  .stat .k{font-family:'Chivo Mono',monospace;font-size:10px;letter-spacing:.13em;
           text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .stat .v{font-size:26px;font-weight:800;letter-spacing:-.03em;
           font-variant-numeric:tabular-nums}
  .stat .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}

  h2{font-size:12px;font-family:'Chivo Mono',monospace;font-weight:600;
     letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
     margin:30px 0 12px}

  .nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .node{padding:16px 18px;position:relative;overflow:hidden}
  .node .name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
  .node .state{font-family:'Chivo Mono',monospace;font-size:10px;
               letter-spacing:.1em;text-transform:uppercase;color:var(--idle)}
  .node.busy .state{color:var(--signal)}
  .caps{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
  .cap{font-family:'Chivo Mono',monospace;font-size:10px;padding:3px 7px;
       border-radius:6px;background:rgba(255,255,255,.06);color:var(--muted);
       border:1px solid var(--edge)}
  .cap.hw{color:var(--signal);border-color:rgba(74,222,155,.28);
          background:rgba(74,222,155,.09)}
  .cap.sw{color:var(--amber);border-color:rgba(242,176,61,.35);
          background:rgba(242,176,61,.1)}
  .node .note{margin-top:10px;font-size:11.5px;line-height:1.5;color:var(--amber)}
  .node .fps{font-family:'Chivo Mono',monospace;font-size:10px;opacity:.7;
             margin-left:4px}
  .slots{display:flex;align-items:center;gap:10px;margin-top:13px;
         padding-top:13px;border-top:1px solid var(--edge)}
  .slots .lbl{font-size:12.5px;color:var(--muted);flex:1;line-height:1.4}
  .slots .lbl b{color:var(--text);font-weight:600}
  .stepper{display:flex;align-items:center;gap:0;border:1px solid var(--edge);
           border-radius:10px;overflow:hidden;flex:none}
  .stepper button{border:0;border-radius:0;padding:6px 12px;font-size:16px;
                  line-height:1;background:rgba(255,255,255,.05)}
  .stepper button:disabled{opacity:.3;cursor:default}
  .stepper .n{padding:0 13px;font-family:'Chivo Mono',monospace;font-size:14px;
              font-variant-numeric:tabular-nums;min-width:34px;text-align:center}
  .slots .tip{font-size:11.5px;color:var(--amber);margin-top:7px;line-height:1.45}

  /* Signature: a live scope trace of encode throughput per node. */
  .scope{height:34px;width:100%;margin-top:13px;display:block;opacity:.9}

  .queue{display:flex;flex-direction:column;gap:9px}
  .job{padding:13px 16px;display:grid;grid-template-columns:1fr auto;
       gap:4px 14px;align-items:center}
  .job .file{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;
             white-space:nowrap}
  .job .meta{font-family:'Chivo Mono',monospace;font-size:10.5px;color:var(--muted);
             grid-column:1;display:flex;gap:10px;flex-wrap:wrap}
  .job .pct{font-family:'Chivo Mono',monospace;font-size:15px;font-weight:600;
            font-variant-numeric:tabular-nums;grid-row:1/3}
  .bar{grid-column:1/-1;height:3px;border-radius:2px;
       background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--signal);
         border-radius:2px;transition:width .5s ease}
  .job .acts{grid-column:1/-1;display:flex;gap:7px;margin-top:10px}
  .job .acts button{padding:5px 11px;font-size:11.5px;border-radius:9px}
  .st-queued .pct{color:var(--amber)}
  .st-running .pct{color:var(--signal)}
  .st-failed .pct{color:var(--fault)}
  .st-ignored .pct{color:var(--idle)}
  .st-done .pct{color:var(--idle)}

  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tabs button{padding:7px 14px;font-size:13px;border-radius:10px;
    display:flex;align-items:center;gap:7px}
  .tabs button.on{border-color:var(--signal);background:rgba(74,222,155,.12);
    color:var(--text)}
  .tabs .badge{font-family:'Chivo Mono',monospace;font-size:10.5px;
    padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.1);
    font-variant-numeric:tabular-nums}
  .tabs button.on .badge{background:rgba(74,222,155,.22);color:var(--signal)}
  .tabs .badge.bad{background:rgba(255,107,107,.18);color:var(--fault)}

  .pager{display:flex;align-items:center;gap:9px;margin-top:14px;flex-wrap:wrap}
  .pager .grow{flex:1}
  .pager .where{font-family:'Chivo Mono',monospace;font-size:11.5px;
                color:var(--muted)}
  .pager select{width:auto;padding:6px 9px;font-size:12.5px}
  .pager button{padding:6px 12px;font-size:12.5px}
  .pager button:disabled{opacity:.35;cursor:default}
  .job .err{grid-column:1/-1;font-size:12px;color:var(--fault);line-height:1.5;
            margin-top:7px;word-break:break-word}
  .job .saved{font-family:'Chivo Mono',monospace;font-size:11px;
              color:var(--signal)}
  .job .grew{font-family:'Chivo Mono',monospace;font-size:11px;color:var(--amber)}
  .job .live{font-family:'Chivo Mono',monospace;font-size:11px;color:var(--muted)}
  .job .sizes{grid-column:1/-1;font-family:'Chivo Mono',monospace;font-size:11px;
              color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;
              align-items:center}
  .job .sizes .sizeline{font-variant-numeric:tabular-nums}
  .job .sizes .arrow{opacity:.55}
  .job .sizes .ratio{color:var(--text);font-weight:600;
                      font-variant-numeric:tabular-nums}
  .job .note{grid-column:1/-1;font-size:12px;color:var(--amber);line-height:1.5;
             margin-top:7px}
  .job .retry{grid-column:1/-1;display:flex;gap:7px;align-items:center;
              margin-top:10px;flex-wrap:wrap}
  .job .retry select{width:auto;padding:6px 10px;font-size:12.5px}
  .st-bloated .pct{color:var(--amber)}
  .tabs .badge.warn-badge{background:rgba(242,176,61,.2);color:var(--amber)}

  .empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:14px}
  .empty b{display:block;color:var(--text);font-weight:600;margin-bottom:5px}

  .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
  .queue-head{display:flex;align-items:center;justify-content:space-between;
              flex-wrap:wrap;gap:10px 14px;margin:30px 0 12px}
  .queue-head h2{margin:0}
  .queue-head .actions{margin:0}
  button{font-family:Archivo,sans-serif;font-size:13px;font-weight:600;
         color:var(--text);background:rgba(255,255,255,.08);
         border:1px solid var(--edge);border-radius:11px;padding:9px 16px;
         cursor:pointer;transition:background .18s,transform .18s}
  button:hover{background:rgba(255,255,255,.14)}
  button:active{transform:scale(.97)}
  button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}


  /* libraries */
  .libs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .lib{padding:17px 19px}
  .lib h3{margin:0 0 3px;font-size:16px;font-weight:600}
  .lib .flow{font-size:12.5px;color:var(--muted);line-height:1.65;margin:9px 0 0}
  .lib .flow b{color:var(--text);font-weight:500}
  .lib .recipe{margin-top:11px;font-family:'Chivo Mono',monospace;font-size:10.5px;
               color:var(--muted);letter-spacing:.04em}
  .lib .row{display:flex;gap:8px;margin-top:13px}
  .lib button{padding:6px 12px;font-size:12px}
  .sec{font-size:11px;color:var(--muted)}


  .banner{padding:14px 16px;border-radius:13px;margin-bottom:18px;
    background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);
    color:#ffc9c9;font-size:13.5px;line-height:1.6}
  .banner b{color:#fff}
  .banner code{font-family:'Chivo Mono',monospace;font-size:12.5px;
    background:rgba(0,0,0,.3);padding:2px 6px;border-radius:5px}
  .banner ul{margin:8px 0 0;padding-left:20px}

  .sched{display:flex;align-items:center;gap:8px;font-family:'Chivo Mono',monospace;
         font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
         color:var(--muted);margin-bottom:18px}
  .sched .lamp{width:7px;height:7px;border-radius:50%;background:var(--amber)}
  .sched .lamp.on{background:var(--signal);box-shadow:0 0 9px var(--signal)}
  .days{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .days label{flex:1;min-width:40px;text-align:center;padding:8px 0;font-size:12px;
    border:1px solid var(--edge);border-radius:9px;cursor:pointer;
    background:rgba(255,255,255,.03)}
  .days label.on{border-color:var(--signal);background:rgba(74,222,155,.12)}
  .days input{display:none}
  .pair{display:flex;gap:10px}
  .pair label{flex:1}
  .toggle{display:flex;align-items:center;gap:11px;padding:13px 15px;
    border:1px solid var(--edge);border-radius:13px;margin-bottom:14px;cursor:pointer;
    background:rgba(255,255,255,.03)}
  .toggle.on{border-color:var(--signal);background:rgba(74,222,155,.08)}
  .toggle .sw{width:38px;height:22px;border-radius:11px;flex:none;
    background:rgba(255,255,255,.14);position:relative;transition:background .2s}
  .toggle.on .sw{background:var(--signal)}
  .toggle .sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;
    height:16px;border-radius:50%;background:#fff;transition:transform .2s}
  .toggle.on .sw::after{transform:translateX(16px)}
  .toggle .tt{font-size:14px;font-weight:600}
  .toggle .td{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:2px}

  /* wizard */
  .veil{position:fixed;inset:0;background:rgba(4,7,12,.72);backdrop-filter:blur(7px);
        display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
  .veil.open{display:flex}
  .wiz{width:min(620px,100%);max-height:88vh;overflow-y:auto;padding:26px}
  .wiz h3{margin:0 0 5px;font-size:20px;font-weight:800;letter-spacing:-.02em}
  .wiz .lead{color:var(--muted);font-size:13.5px;line-height:1.6;margin:0 0 20px}
  .steps{display:flex;gap:5px;margin-bottom:22px}
  .steps i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.1);
           cursor:pointer;transition:background .15s;position:relative}
  .steps i::after{content:'';position:absolute;inset:-8px 0;}
  .steps i:hover{background:rgba(255,255,255,.3)}
  .steps i.on{background:var(--signal)}
  .steps i.on:hover{background:#7af0b8}

  /* Review rows jump straight to the step that owns them. */
  .review-row{display:flex;gap:12px;align-items:baseline;padding:8px 11px;
    margin:0 -11px;border-radius:9px;cursor:pointer;transition:background .15s}
  .review-row:hover{background:rgba(255,255,255,.06)}
  .review-row:hover .edit{opacity:1}
  .review-row b{color:var(--muted);font-weight:400;min-width:108px;flex:none;
                font-size:13px}
  .review-row .val{flex:1;font-size:13.5px;line-height:1.5}
  .review-row .edit{opacity:0;font-size:11.5px;color:var(--signal);flex:none;
                    transition:opacity .15s}
  @media (max-width:560px){ .review-row .edit{opacity:.6} }
  label.fld{display:block;margin-bottom:16px}
  label.fld span{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
  label.fld em{display:block;font-style:normal;font-size:12px;color:var(--muted);
               margin-bottom:7px;line-height:1.5}
  input[type=text],select{width:100%;padding:11px 13px;font-size:14px;
    font-family:Archivo,sans-serif;color:var(--text);
    background:rgba(255,255,255,.06);border:1px solid var(--edge);border-radius:11px}
  input[type=text]:focus,select:focus{outline:2px solid var(--signal);outline-offset:1px}
  select option{background:#141b26}

  .choice{display:block;padding:13px 15px;border:1px solid var(--edge);
          border-radius:13px;margin-bottom:9px;cursor:pointer;
          background:rgba(255,255,255,.03);transition:border-color .15s,background .15s}
  .choice:hover{background:rgba(255,255,255,.07)}
  .choice.sel{border-color:var(--signal);background:rgba(74,222,155,.09)}
  .choice input{position:absolute;opacity:0;pointer-events:none}
  .choice .t{font-weight:600;font-size:14.5px;display:flex;align-items:center;
             gap:8px;flex-wrap:wrap}
  .choice .badge{font-family:'Chivo Mono',monospace;font-size:9.5px;
                 letter-spacing:.1em;text-transform:uppercase;color:var(--signal);
                 border:1px solid rgba(74,222,155,.35);border-radius:5px;padding:2px 6px}
  .choice .alt{font-weight:400;color:var(--muted);font-size:12.5px}
  .choice .d{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:5px}
  .choice .w{font-size:12.5px;color:var(--text);line-height:1.55;margin-top:5px;
             opacity:.82}

  .warn{padding:12px 14px;border-radius:11px;margin-bottom:10px;font-size:13px;
        line-height:1.55;background:rgba(242,176,61,.11);
        border:1px solid rgba(242,176,61,.32);color:#f6d79a}
  .review{font-size:13.5px;line-height:1.9}
  .review b{color:var(--muted);font-weight:400;display:inline-block;min-width:112px}
  .wiz-nav{display:flex;gap:9px;margin-top:22px}
  .wiz-nav .grow{flex:1}
  .primary{background:var(--signal);color:#06120c;border-color:transparent}
  .primary:hover{background:#63e8ac}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:560px){ body{padding:16px 12px 50px} h1{font-size:19px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Forge</h1>
    <span class="tag">distributed transcoding</span>
    <span class="pill"><span class="dot" id="dot"></span><span id="conn">connecting</span></span>
  </header>

  <div id="banner"></div>
  <div class="sched"><span class="lamp" id="lamp"></span><span id="schedtext">—</span></div>

  <div class="stats">
    <div class="glass stat"><div class="k">Space reclaimed</div><div class="v" id="s-saved">—</div></div>
    <div class="glass stat"><div class="k">Completed</div><div class="v" id="s-done">—</div></div>
    <div class="glass stat"><div class="k">In queue</div><div class="v" id="s-queued">—</div></div>
    <div class="glass stat"><div class="k">Failed</div><div class="v" id="s-failed">—</div></div>
  </div>

  <h2>Libraries</h2>
  <div class="libs" id="libs"></div>

  <h2>Nodes</h2>
  <div class="nodes" id="nodes"></div>

  <div class="queue-head">
    <h2>Queue</h2>
    <div class="actions">
      <button class="primary" onclick="openWizard()">Add a library</button>
      <button onclick="scanAll()">Check folders now</button>
      <button onclick="openSettings()">Settings</button>
      <button onclick="sweepNow()">Clean up Originals</button>
    </div>
  </div>
  <div class="tabs" id="libtabs"></div>
  <div class="tabs" id="jobtabs"></div>
  <div class="queue" id="queue"></div>
  <div class="pager" id="pager"></div>
</div>

<div class="veil" id="veil">
  <div class="glass wiz" id="wiz"></div>
</div>

<script>
const HW = ['nvenc','qsv','amf','vaapi','videotoolbox'];
const traces = {};   // node id -> recent fps samples

const fmtBytes = b => {
  if (!b) return '0<small>GB</small>';
  const gb = b / 1e9;
  return gb >= 1 ? gb.toFixed(1) + '<small>GB</small>'
                 : (b / 1e6).toFixed(0) + '<small>MB</small>';
};

function drawScope(canvas, samples) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.offsetWidth * 2;
  const h = canvas.height = 68;
  ctx.clearRect(0, 0, w, h);
  if (!samples.length) return;
  const peak = Math.max(...samples, 10);
  ctx.beginPath();
  samples.forEach((v, i) => {
    const x = (i / Math.max(samples.length - 1, 1)) * w;
    const y = h - (v / peak) * (h - 8) - 4;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.strokeStyle = '#4ade9b';
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, 'rgba(74,222,155,.28)');
  grad.addColorStop(1, 'rgba(74,222,155,0)');
  ctx.fillStyle = grad;
  ctx.fill();
}

function render(state) {
  const st = state.stats || {};
  document.getElementById('s-saved').innerHTML =
    fmtBytes(Math.max(0, (st.before || 0) - (st.after || 0)));
  document.getElementById('s-done').textContent = st.done ?? 0;
  document.getElementById('s-queued').textContent = st.queued ?? 0;
  document.getElementById('s-failed').textContent = st.failed ?? 0;

  const running = {};
  (state.jobs || []).forEach(j => {
    if (j.state === 'running' && j.node_id) running[j.node_id] = j;
  });
  window.__state = state;

  const nodesEl = document.getElementById('nodes');
  if (!state.nodes.length) {
    // Nothing converts until a worker connects, so this is the one empty
    // state that has to explain itself properly.
    nodesEl.innerHTML = `<div class="glass empty" style="text-align:left">
      <b style="text-align:center;display:block">No machines are connected</b>
      <div style="max-width:520px;margin:0 auto;line-height:1.65">
        Forge doesn't convert anything itself \u2014 it watches folders, works
        out what needs doing, and files the results. The converting happens on
        whichever computers you connect to it.
        <div style="margin-top:12px">On a Mac or Linux machine, copy the Forge
        folder across and run:</div>
        <div style="font-family:'Chivo Mono',monospace;font-size:12px;
             background:rgba(0,0,0,.3);padding:9px 12px;border-radius:8px;
             margin:8px 0;word-break:break-all">./run-node.sh ${location.origin}</div>
        ${location.protocol === 'https:' || !/^(\d+\.|localhost|127\.)/.test(location.hostname)
          ? `<div style="color:var(--amber);font-size:12.5px;line-height:1.55">
              You're viewing this through a proxy or public address. That's
              right for the interface, but point workers at the server's
              address on your own network instead \u2014 they move whole video
              files, which proxies tend to cut off.</div>` : ''}
        <div style="margin-top:8px">It appears here within a few seconds. Add
        as many as you like.</div>
      </div></div>`;
  } else {
    nodesEl.innerHTML = state.nodes.map(n => {
      const job = running[n.id];
      const recipes = n.recipes || {}, marks = n.benchmarks || {};
      const marks10 = n.benchmarks_10bit || {};
      // A hardware encoder that quietly drops to software for 10-bit is the
      // most confusing cliff there is: the badge says 170 fps, one file runs
      // at 5. Worth stating outright.
      // A zero means the 10-bit test produced nothing, which is normal for
      // H.264 hardware encoders — no consumer chip does 10-bit H.264. Only
      // an encoder that manages 10-bit *badly* is worth mentioning.
      const slow10 = Object.entries(marks10)
        .filter(([e, ten]) => marks[e] && ten > 0 && ten < marks[e] * 0.4)
        .map(([e, ten]) => ({enc: e, ten, eight: marks[e]}));
      const softwareFallback = Object.entries(recipes)
        .filter(([, r]) => (r || '').includes('SOFTWARE')).map(([e]) => e);
      const caps = (n.encoders || []).map(e => {
        const isHw = HW.some(h => e.endsWith(h));
        const isSw = softwareFallback.includes(e);
        const ten = marks10[e];
        const tenSlow = ten > 0 && marks[e] && ten < marks[e] * 0.4;
        const fps = marks[e]
          ? `<span class="fps">${marks[e]}fps${ten > 0
              ? ` / ${ten}<span style="opacity:.7">\u00d710bit</span>` : ''}</span>`
          : '';
        return `<span class="cap ${isSw || tenSlow ? (isSw ? 'sw' : 'hw') : isHw ? 'hw' : ''}"
                >${e}${fps}</span>`;
      }).join('');
      // Name the encoder that will actually be used, so a slow fallback
      // sitting in the list doesn't imply jobs are going to it.
      const fastest = Object.entries(marks).sort((a,b) => b[1]-a[1])[0];
      const notes = [];
      if (softwareFallback.length)
        notes.push(`${softwareFallback.join(', ')} is running in software, not
          on the graphics hardware. Jobs go to the fastest encoder available,
          so this one won't be used unless nothing else fits.`);
      for (const s of slow10)
        notes.push(`${s.enc} manages ${s.eight}fps at 8-bit but only
          ${s.ten}fps at 10-bit \u2014 the hardware is giving up and using
          software for 10-bit video. Set a library's colour depth to 8-bit
          if 10-bit files crawl.`);
      const note = notes.map(t => `<div class="note">${t}</div>`).join('');
      const mine = (state.jobs || []).filter(
        j => j.node_id === n.id && j.state === 'running');
      const totalFps = mine.reduce((sum, j) => sum + (j.fps || 0), 0);
      const label = !n.online ? 'offline'
                  : mine.length > 1
                    ? `encoding ${mine.length} · ${totalFps.toFixed(0)} fps`
                    : mine.length ? `encoding · ${totalFps.toFixed(0)} fps`
                    : 'idle';
      return `<div class="glass node ${job ? 'busy' : ''}">
        <div class="name">${n.name}<span class="state">${label}</span></div>
        <div class="caps">${caps || '<span class="cap">no encoders</span>'}</div>
        ${note}
        <canvas class="scope" data-node="${n.id}"></canvas>
        ${slotControl(n)}
      </div>`;
    }).join('');

    state.nodes.forEach(n => {
      const total = (state.jobs || [])
        .filter(j => j.node_id === n.id && j.state === 'running')
        .reduce((sum, j) => sum + (j.fps || 0), 0);
      traces[n.id] = (traces[n.id] || []).concat(total).slice(-48);
      const c = nodesEl.querySelector(`canvas[data-node="${n.id}"]`);
      if (c) drawScope(c, traces[n.id]);
    });
  }

  // An out-of-date server file breaks features in ways that look like bugs,
  // so it's said plainly rather than left in the terminal log.
  const problems = state.module_problems || [];
  document.getElementById('banner').innerHTML = problems.length
    ? `<div class="banner"><b>Some server files are out of date.</b>
        Parts of Forge will not work until they're replaced.
        <ul>${problems.map(p => `<li>${p}</li>`).join('')}</ul>
        <div style="margin-top:10px">Unzip the release over this folder,
        making sure it replaces existing files, then restart:<br>
        <code>cd ~/Downloads &amp;&amp; unzip -o forge.zip</code></div></div>`
    : '';

  const lamp = document.getElementById('lamp');
  lamp.classList.toggle('on', state.schedule_open !== false);
  document.getElementById('schedtext').textContent =
    (state.schedule_open === false ? 'Paused — ' : '') +
    (state.schedule_text || 'Running any time') +
    (state.originals && state.originals.n
      ? `  \u00b7  ${state.originals.n} originals held (${(state.originals.bytes/1e9).toFixed(1)} GB)`
      : '') +
    (state.cleanup_text && state.originals && state.originals.n
      ? `  \u00b7  ${state.cleanup_text.toLowerCase()}` : '');

  renderLibs(state.libraries);
  renderLibTabs(state.libraries);

  const id = view.library_id;
  const counts = id == null ? (state.counts || {})
    : (state.counts_by_library || {})[id] || {active:0,failed:0,bloated:0,done:0};
  view.counts = counts;
  renderTabs(counts);
  if (view.name === 'active') {
    renderJobs((state.jobs || []).filter(j => id == null || j.library_id === id), null);
  } else if (!view.loaded) loadView();
}


/* ------------------------------------------------------- libraries */
const ORIGINAL_LABEL = {
  archive: 'kept in an Originals folder',
  delete: 'deleted',
  keep: 'left in place',
};

function renderLibs(libs) {
  const el = document.getElementById('libs');
  if (!libs || !libs.length) {
    el.innerHTML = `<div class="glass empty"><b>No libraries yet</b>
      Add one and Forge will watch a folder for new files, convert them,
      and file them where you want.</div>`;
    return;
  }
  el.innerHTML = libs.map(l => {
    const p = l.profile || {};
    const n = l.naming || {};
    const dest = l.output_path
      ? `moves them to <b>${l.output_path}</b>`
      : 'converts them <b>where they sit</b>';
    const recipe = [
      (p.video_codec || 'hevc').toUpperCase(),
      (p.container || 'mkv').toUpperCase(),
      (p.audio_codec || 'aac').toUpperCase(),
      p.subtitle_mode === 'strip' ? 'no subs'
        : p.subtitle_mode === 'forced' ? 'forced subs'
        : p.subtitle_mode === 'languages' ? (p.subtitle_languages || []).join('/')
        : 'all subs',
      n.enabled ? `renamed for ${n.scheme || 'jellyfin'}` : null,
    ].filter(Boolean).join(' · ');
    const safeName = String(l.name).replace(/'/g, "\\'");
    return `<div class="glass lib">
      <h3>${l.name}</h3>
      <div class="sec">${l.enabled ? 'Watching' : 'Paused'}</div>
      <p class="flow">Watches <b>${l.watch_path}</b>, then ${dest}.<br>
        Originals: <b>${ORIGINAL_LABEL[l.original_action] || l.original_action}</b></p>
      <div class="recipe">${recipe}</div>
      <div class="row">
        <button onclick="openWizard(${l.id})">Edit</button>
        <button onclick="scanOne(${l.id})">Check now</button>
        <button onclick="toggleLib(${l.id},${l.enabled ? 0 : 1})">${l.enabled ? 'Pause' : 'Resume'}</button>
        <button onclick="removeLib(${l.id},'${safeName}')">Remove</button>
      </div>
    </div>`;
  }).join('');
}

/* ------------------------------------------------ concurrency per node */
// Held between renders so the number responds to a click immediately,
// rather than waiting for the server to echo it back over the websocket.
const pendingSlots = {};

function slotControl(n) {
  const server = n.slots == null ? (n.max_jobs || 1) : n.slots;
  const slots = pendingSlots[n.id] != null ? pendingSlots[n.id] : server;
  if (pendingSlots[n.id] != null && server === pendingSlots[n.id])
    delete pendingSlots[n.id];

  const cpus = n.cpus || 0;
  const usingHardware = Object.keys(n.benchmarks || {}).some(
    e => HW.some(h => e.endsWith(h)));

  // More is not always faster. Hardware encoders have a fixed number of
  // engines, so past two the jobs just queue inside the driver; software
  // encoders already use every core for a single job.
  let tip = '';
  if (slots === 0)
    tip = 'Set this above zero to let it start converting again.';
  else if (slots > 2 && usingHardware)
    tip = 'Hardware encoders rarely get faster past 2 at once — the chip '
        + 'has a fixed number of engines.';
  else if (cpus && slots > Math.max(1, Math.floor(cpus / 4)) && !usingHardware)
    tip = `Software encoding already uses all ${cpus} cores for one file. `
        + 'Running several at once mostly just slows each of them down.';

  const label = slots === 0 ? '<b>Not converting</b> \u2014 this machine is '
      + 'connected but won\'t be given any work'
    : slots === 1 ? '<b>1</b> file at a time'
    : `<b>${slots}</b> files at once`;

  return `<div class="slots">
    <div class="lbl">${label}${tip ? `<div class="tip">${tip}</div>` : ''}</div>
    <div class="stepper" data-node="${n.id}">
      <button onclick="setSlots('${n.id}',${slots - 1})"
        ${slots <= 0 ? 'disabled' : ''} aria-label="Fewer at once">&minus;</button>
      <span class="n">${slots}</span>
      <button onclick="setSlots('${n.id}',${slots + 1})"
        ${slots >= 16 ? 'disabled' : ''} aria-label="More at once">+</button>
    </div>
  </div>`;
}

async function setSlots(id, value) {
  const wanted = Math.max(0, Math.min(16, value));
  pendingSlots[id] = wanted;
  const box = document.querySelector(`.stepper[data-node="${id}"] .n`);
  if (box) box.textContent = wanted;

  try {
    const r = await fetch(`/api/nodes/${id}/slots`, {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({slots: wanted})});
    if (!r.ok) {
      delete pendingSlots[id];
      alert(r.status === 404
        ? 'This version of the server does not support changing the number '
        + 'of files yet. Update the server files and restart Forge.'
        : `Could not change it (error ${r.status}).`);
      return;
    }
    pendingSlots[id] = (await r.json()).slots;
  } catch (e) {
    delete pendingSlots[id];
    alert('Could not reach the server to change that.');
  }
}

/* ------------------------------------------------------- job actions */
// Every one of these ignored the reply, so a rejected request looked
// exactly like a working button that did nothing.
async function callJob(id, path, options) {
  try {
    const r = await fetch(`/api/jobs/${id}/${path}`, {method:'POST', ...options});
    if (!r.ok) {
      let detail = `The server refused that (error ${r.status}).`;
      try { detail = (await r.json()).detail || detail; } catch (e) {}
      alert(detail);
      return null;
    }
    return await r.json().catch(() => ({}));
  } catch (e) {
    alert('Could not reach the server.');
    return null;
  }
}

async function retryJob(id) {
  const result = await callJob(id, 'retry');
  if (result && result.message) alert(result.message);
  if (result) loadView();
}

async function requeueJob(id, state) {
  const warning = state === 'running'
    ? 'This job is part-way through. Restarting throws away that progress and '
    + 'starts over — worth it only if it would now use a faster encoder.\n\nRestart?'
    : 'Put this job back in the queue?';
  if (!confirm(warning)) return;
  const result = await callJob(id, 'retry');
  if (result && result.message) alert(result.message);
  if (result && view.name !== 'active') loadView();
}

async function cancelJob(id) {
  if (!confirm('Cancel this job? The original file is left untouched.')) return;
  const result = await callJob(id, 'cancel');
  if (result && view.name !== 'active') loadView();
}

/* --------------------------------------------------------- job views */
const view = {name:'active', page:1, perPage:20, loaded:false, counts:{},
              library_id:null};

/* Each library gets its own queue: this draws the picker (All + one tab
   per library) and switchLibrary() below re-scopes whichever state tab
   (active/failed/bloated/done) is currently open to just that library. */
function renderLibTabs(libs) {
  const el = document.getElementById('libtabs');
  const all = [{id: null, name: 'All'}].concat(
    (libs || []).map(l => ({id: l.id, name: l.name})));
  el.innerHTML = all.map(l =>
    `<button class="${view.library_id === l.id ? 'on' : ''}"
      onclick="switchLibrary(${l.id === null ? 'null' : l.id})">${l.name}</button>`
  ).join('');
}

function switchLibrary(id) {
  if (view.library_id === id) return;
  view.library_id = id;
  view.page = 1;
  view.loaded = false;
  renderLibTabs((window.__state || {}).libraries || []);
  if (view.name === 'active') {
    // Active jobs already arrive live over the websocket, so filtering
    // that in place keeps progress updating instead of falling back to
    // polling — only the other (non-live) tabs need a fetch.
    const state = window.__state || {};
    const counts = id == null ? state.counts
      : (state.counts_by_library || {})[id] || {active:0,failed:0,bloated:0,done:0};
    view.counts = counts;
    renderTabs(counts);
    renderJobs((state.jobs || []).filter(j => id == null || j.library_id === id), null);
    document.getElementById('pager').innerHTML = '';
  } else {
    loadView();
  }
}

function renderTabs(counts) {
  view.counts = counts;
  const defs = [
    ['active', 'In progress', counts.active || 0, ''],
    ['failed', 'Failed', counts.failed || 0, 'bad'],
    ['bloated', 'Got bigger', counts.bloated || 0, 'warn-badge'],
    ['ignored', 'Ignored', counts.ignored || 0, ''],
    ['done', 'Completed', counts.done || 0, ''],
  ];
  document.getElementById('jobtabs').innerHTML = defs.map(([id, label, n, cls]) =>
    `<button class="${view.name === id ? 'on' : ''}" onclick="switchView('${id}')">
      ${label}<span class="badge ${n ? cls : ''}">${n}</span></button>`
  ).join('');
}

function switchView(name) {
  view.name = name;
  view.page = 1;
  view.loaded = false;
  renderTabs(view.counts);
  if (name === 'active') {
    const id = view.library_id;
    renderJobs((((window.__state || {}).jobs) || [])
      .filter(j => id == null || j.library_id === id), null);
    document.getElementById('pager').innerHTML = '';
  } else {
    loadView();
  }
}

async function loadView() {
  const el = document.getElementById('queue');
  el.innerHTML = '<div class="glass empty">Loading…</div>';
  try {
    const libParam = view.library_id == null ? '' : `&library_id=${view.library_id}`;
    const r = await (await fetch(
      `/api/jobs?view=${view.name}&page=${view.page}&per_page=${view.perPage}${libParam}`)).json();
    view.loaded = true;
    view.page = r.page;
    renderTabs(r.counts || view.counts);
    renderJobs(r.jobs, r);
  } catch (e) {
    el.innerHTML = '<div class="glass empty">Could not load that list.</div>';
  }
}

const ACTION_LABEL = {audio_only:'audio only', video_only:'video only',
                     remux:'repackage', full:'full convert', skip:'—'};

function renderJobs(jobs, meta) {
  const el = document.getElementById('queue');
  if (!jobs.length) {
    el.innerHTML = `<div class="glass empty">${
      view.name === 'failed' ? '<b>Nothing has failed</b>All good.'
      : view.name === 'bloated' ? '<b>Nothing came out bigger</b>Files that grow instead of shrinking are listed here.'
      : view.name === 'ignored' ? '<b>Nothing ignored</b>Files that still fail with their audio left untouched land here instead of cluttering Failed.'
      : view.name === 'done' ? '<b>Nothing finished yet</b>Completed conversions collect here.'
      : '<b>Nothing queued</b>Drop a file into a watch folder and it will appear.'}</div>`;
    renderPager(meta);
    return;
  }

  el.innerHTML = jobs.map(j => {
    const name = j.path.split('/').pop();
    const bits = [ACTION_LABEL[j.spec.action] || (j.spec.codec || '').toUpperCase()];
    if (!['audio_only','remux'].includes(j.spec.action)) bits.push('q' + j.spec.quality);
    if (j.transport) bits.push(j.transport === 'stream' ? 'streamed' : 'mounted');
    if (j.encoder_used) bits.push(j.encoder_used);
    if (j.speed) bits.push(j.speed.toFixed(1) + '×');

    const pct = j.state === 'failed' ? '!'
              : j.state === 'ignored' ? '–'
              : j.state === 'bloated' ? '↑'
              : j.state === 'done' ? '✓'
              : j.state === 'queued' ? '·'
              : Math.round(j.progress) + '%';

    // Original vs. new size, shown consistently across every list — not
    // just once a job finishes. Three cases: both sizes known (done or
    // bloated), a live projection from bytes-written-so-far while running,
    // or — queued/failed/ignored — just the original, which is still
    // useful context even with nothing yet to compare it to.
    let sizes = '';
    if (j.size_before) {
      const before = fmtSize(j.size_before);
      if (j.size_after) {
        const ratio = j.size_after / j.size_before;
        const pct = (1 - ratio) * 100;
        const cls = pct >= 0 ? 'saved' : 'grew';
        const verb = pct >= 0 ? `saved ${pct.toFixed(0)}%`
                              : `${Math.abs(pct).toFixed(0)}% larger`;
        sizes = `<span class="sizeline">${before} <span class="arrow">&rarr;</span> ${fmtSize(j.size_after)}</span>
                 <span class="ratio">${ratio.toFixed(2)}&times;</span>
                 <span class="${cls}">${verb}</span>`;
      } else if (j.state === 'running' && j.size_now && j.progress > 3) {
        const projected = j.size_now / (j.progress / 100);
        const ratio = projected / j.size_before;
        const pct = (1 - ratio) * 100;
        const cls = pct >= 0 ? 'live' : 'grew';
        const verb = pct >= 0 ? `on track to save ${pct.toFixed(0)}%`
                              : `on track to be ${Math.abs(pct).toFixed(0)}% larger`;
        sizes = `<span class="sizeline">${before} <span class="arrow">&rarr;</span> ~${fmtSize(projected)} so far</span>
                 <span class="ratio">${ratio.toFixed(2)}&times;</span>
                 <span class="${cls}">${verb}</span>`;
      } else {
        sizes = `<span class="sizeline">${before}</span>`;
      }
    }

    const actions = j.state === 'failed'
      ? `<button onclick="retryJob(${j.id})">Try again</button>
         <button onclick="removeJob(${j.id})">Remove</button>`
      : j.state === 'ignored'
      ? `<button onclick="retryJob(${j.id})">Try again</button>
         <button onclick="removeJob(${j.id})">Remove</button>`
      : j.state === 'bloated'
      ? `<button onclick="acceptJob(${j.id})">Keep it anyway</button>
         <button onclick="removeJob(${j.id})">Remove</button>`
      : j.state === 'done'
      ? `<button onclick="removeJob(${j.id})">Remove</button>`
      : `<button onclick="requeueJob(${j.id},'${j.state}')">Restart</button>
         <button onclick="cancelJob(${j.id})">Cancel</button>`;

    return `<div class="glass job st-${j.state}">
      <div class="file">${name}</div>
      <div class="pct">${pct}</div>
      <div class="meta">${bits.filter(Boolean).join(' · ')}</div>
      ${sizes ? `<div class="sizes">${sizes}</div>` : ''}
      ${j.state === 'failed' && j.error
        ? `<div class="err">${j.error}</div>` : ''}
      ${j.outcome && j.state !== 'failed'
        ? `<div class="note" ${j.state === 'bloated'
             ? '' : 'style="color:var(--muted)"'}>${j.outcome}</div>` : ''}
      ${j.state === 'bloated'
        ? `<div class="retry" id="retry-${j.id}"></div>` : ''}
      ${['queued','leased','running'].includes(j.state)
        ? `<div class="bar"><i style="width:${j.progress || 0}%"></i></div>` : ''}
      <div class="acts">${actions}</div>
    </div>`;
  }).join('');

  renderPager(meta);
  jobs.filter(j => j.state === 'bloated').forEach(j => loadRetryOptions(j.id));
}

const fmtSize = b => !b ? '0 MB'
  : b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : (b / 1e6).toFixed(0) + ' MB';

// Options depend on whether a source still exists to convert from, so they
// are fetched per job rather than assumed.
async function loadRetryOptions(jobId) {
  const box = document.getElementById('retry-' + jobId);
  if (!box) return;
  if (!CAT_SCALE) {
    try { CAT_SCALE = (await (await fetch('/api/catalog')).json()).quality_scale; }
    catch (e) { CAT_SCALE = []; }
  }
  let o;
  try {
    o = await (await fetch('/api/jobs/' + jobId + '/retry-options')).json();
  } catch (e) { box.innerHTML = ''; return; }

  if (!o.can_retry) {
    box.innerHTML = '<div class="note" style="margin:0">' + o.reason + '</div>';
    return;
  }
  const scale = (CAT_SCALE || []).map(q =>
    `<option value="${q.value}">${q.name} \u2014 ${q.detail}</option>`).join('');
  const steps = o.steps.filter(st => st.quality).map(st =>
    `<option value="${st.quality}">${st.name}</option>`).join('');
  box.innerHTML = `
    <select id="q-${jobId}">
      <optgroup label="Steps down from this library's usual quality">${steps}</optgroup>
      <optgroup label="Or pick a quality directly">${scale}</optgroup>
    </select>
    <button onclick="doRetranscode(${jobId})">Convert again, smaller</button>
    <span class="live">lower quality = smaller file</span>`;
}

// Filled from the catalog so the same wording is used everywhere.
let CAT_SCALE = null;

async function doRetranscode(jobId) {
  const sel = document.getElementById('q-' + jobId);
  const quality = +sel.value;
  if (!quality) return alert('Pick a quality first.');
  const r = await fetch('/api/jobs/' + jobId + '/retranscode', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({quality})});
  if (!r.ok) return alert((await r.json()).detail || 'Could not queue that.');
  loadView();
}

async function acceptJob(jobId) {
  if (!confirm('Keep the converted file even though it got bigger?')) return;
  if (await callJob(jobId, 'accept')) loadView();
}

function renderPager(meta) {
  const el = document.getElementById('pager');
  if (!meta) { el.innerHTML = ''; return; }
  const first = (meta.page - 1) * meta.per_page + 1;
  const last = Math.min(meta.page * meta.per_page, meta.total);
  const bulk = (view.name === 'failed' || view.name === 'ignored')
    ? `<button onclick="bulkJobs('retry')">Retry all ${meta.total}</button>
       <button onclick="bulkJobs('clear')">Remove all</button>`
    : view.name === 'done'
    ? `<button onclick="bulkJobs('clear')">Clear history</button>` : '';

  el.innerHTML = `
    <span class="where">${meta.total ? `${first}–${last} of ${meta.total}` : '0'}</span>
    <select onchange="view.perPage=parseInt(this.value);view.page=1;loadView()">
      ${[10,20,50,100].map(n =>
        `<option value="${n}" ${view.perPage === n ? 'selected' : ''}>${n} per page</option>`
      ).join('')}
    </select>
    <button onclick="view.page--;loadView()" ${meta.page <= 1 ? 'disabled' : ''}>Back</button>
    <button onclick="view.page++;loadView()" ${meta.page >= meta.pages ? 'disabled' : ''}>Next</button>
    <span class="grow"></span>${bulk}`;
}

async function removeJob(id) {
  if (!confirm('Remove this from the list? The video file itself is not touched.')) return;
  await fetch(`/api/jobs/${id}`, {method:'DELETE'});
  loadView();
}

async function bulkJobs(action) {
  const total = view.counts[view.name] || 0;
  const label = view.name === 'ignored' ? 'ignored' : view.name;
  const message = action === 'retry'
    ? `Put all ${total} ${label} job(s) back in the queue?`
    : `Remove all ${total} entries from this list? Video files are not touched.`;
  if (!confirm(message)) return;
  const r = await (await fetch('/api/jobs/bulk', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action, view: view.name})})).json();
  if (r.skipped) alert(`${r.requeued} requeued. ${r.skipped} skipped — already queued.`);
  view.page = 1;
  loadView();
}

async function scanOne(id) {
  const r = await (await fetch(`/api/libraries/${id}/scan`, {method:'POST'})).json();
  alert(`Queued ${r.queued}. Still copying: ${r.waiting}. Already correct: ${r.already_ok}.`);
}
async function scanAll() {
  const libs = (await (await fetch('/api/libraries')).json());
  if (!libs.length) return alert('Add a library first.');
  for (const l of libs) await fetch(`/api/libraries/${l.id}/scan`, {method:'POST'});
  alert('Checked every watch folder.');
}
async function toggleLib(id, enabled) {
  await fetch(`/api/libraries/${id}`, {method:'PATCH',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify({enabled})});
}
async function removeLib(id, name) {
  if (!confirm(`Stop watching "${name}"? Files already converted stay where they are.`)) return;
  await fetch(`/api/libraries/${id}`, {method:'DELETE'});
}

async function openSettings() {

}

      </div>` : ''}

    <label class="fld"><span>How often to check folders</span>
      <em>Seconds between automatic checks. 30 is a good default.</em>
      <input type="text" value="${SET.scan_seconds ?? 30}"
             oninput="SET.scan_seconds=parseInt(this.value)||30"></label>

    <div class="toggle ${(SET.auto_fail||{}).enabled ? 'on' : ''}"

      <div class="sw"></div>

        <div class="td">Occasionally a file simply won't convert and sits
          there holding a slot open. This stops it, moves it to the Failed
          list with the reason, and frees the machine. Only ever applies to

          </select></label>
      </div>

      <div class="toggle ${SET.auto_fail.stall_enabled !== false ? 'on' : ''}"

        <div class="sw"></div>
        <div><div class="tt">Also give up if it stops making progress</div>
          <div class="td">Catches a stuck job in minutes rather than waiting

      </div>

        <label class="fld"><span>No progress for</span>
