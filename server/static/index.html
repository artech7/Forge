function toggleSched() {
  SET.schedule = SET.schedule || {};
  SET.schedule.enabled = !SET.schedule.enabled;
  if (!SET.schedule.windows || !SET.schedule.windows.length)
    SET.schedule.windows = [{days:[0,1,2,3,4,5,6],start:'22:00',end:'06:00'}];
  drawSettings();
}
function toggleAutoFail() {
  SET.auto_fail = SET.auto_fail || {amount:6, unit:'hours',
                                    stall_enabled:true, stall_minutes:30};
  SET.auto_fail.enabled = !SET.auto_fail.enabled;
  drawSettings();
}

function toggleTmdb() {
  SET.tmdb = SET.tmdb || {key:'', enabled:false};
  SET.tmdb.enabled = !SET.tmdb.enabled;
  drawSettings();
}

async function testTmdb() {
  const el = document.getElementById('tmdbresult');
  el.textContent = 'Checking…';
  el.style.color = 'var(--muted)';
  try {
    const r = await (await fetch('/api/lookup/test', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({key: (SET.tmdb||{}).key})})).json();
    el.textContent = r.message;
    el.style.color = r.ok ? 'var(--signal)' : 'var(--fault)';
  } catch (e) {
    el.textContent = 'Could not check right now.';
    el.style.color = 'var(--fault)';
  }
}

function toggleOrig() {
  SET.originals = SET.originals || {};
  SET.originals.enabled = !SET.originals.enabled;
  if (!SET.originals.mode) SET.originals.mode = 'daily';
  if (!Array.isArray(SET.originals.days))
    SET.originals.days = [0, 1, 2, 3, 4, 5, 6];
  if (SET.originals.interval_hours == null) SET.originals.interval_hours = 24;
  if (SET.originals.run_at == null) SET.originals.run_at = '03:00';
  if (SET.originals.after_days == null) SET.originals.after_days = 14;
  drawSettings();
}
function toggleCleanupDay(i) {
  SET.originals = SET.originals || {};
  const days = SET.originals.days = SET.originals.days || [];
  const at = days.indexOf(i);
  if (at >= 0) days.splice(at, 1); else days.push(i);
  days.sort((a, b) => a - b);
  drawSettings();
}

function toggleDay(i) {
  const w = SET.schedule.windows[0];
  w.days = w.days || [];
  w.days = w.days.includes(i) ? w.days.filter(d => d !== i) : [...w.days, i].sort();
  drawSettings();
}
function setWin(key, val) { SET.schedule.windows[0][key] = val; }

async function saveSettings() {
  const r = await fetch('/api/settings', {method:'PUT',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify(SET)});
  // Keep the description in step with what was saved.
  try { SET = await r.json(); } catch (e) {}
  closeWizard();
}

async function sweepNow() {
  const rows = await (await fetch('/api/originals')).json();
  if (!rows.length) return alert('The Originals folder is already empty.');
  const unverified = rows.filter(r => !r.replacement_ok).length;
  const msg = `Delete ${rows.length - unverified} original file(s)?\n\n` +
    (unverified ? `${unverified} will be kept — their converted version is missing.\n\n` : '') +
    `This cannot be undone.`;
  if (!confirm(msg)) return;
  const r = await (await fetch('/api/originals/sweep?force=true', {method:'POST'})).json();
  alert(`Deleted ${r.deleted}, freed ${(r.freed/1e9).toFixed(2)} GB. Kept ${r.kept}.`);
}

/* ------------------------------------------------------------- wizard */
let CAT = null, step = 0, draft = {};
const STEPS = ['Name and folders', 'Video', 'Colour and HDR', 'Audio', 'Subtitles', 'Tracks', 'Naming', 'Extras', 'Skip rules', 'Originals', 'Size check', 'Review'];

function blankDraft() {
  return { name:'', watch_path:'', output_path:'',
    video_codec:'hevc', container:'mkv', quality_level:'balanced',
    audio_codec:'aac', audio_bitrate:'160k',
    hdr_mode:'preserve', bit_depth:'match', tag_colours:true,
    audio_language_mode:'keep_all', audio_languages_list:['eng'],
    remove_images:true, keep_forced_subs:true, default_first_subtitle:false,
    subtitle_mode:'keep', subtitle_languages:['eng'],
    naming:{ enabled:true, scheme:'jellyfin', folders:true, skip_uncertain:true },
    keep_chapters:true, clean_metadata:false, tidy_track_names:true,
    downmix:'', normalise_loudness:false,
    original_action:'archive', originals_path:'',
    min_saving_percent:'', auto_retry:true, salvage_when_stuck:true,
    auto_retry_steps:['small','smaller'], auto_retry_custom:'',
    filters:{ skip_extensions:[], skip_name_contains:[],
              min_size_mb:'', max_size_mb:'',
              min_minutes:'', max_minutes:'', skip_video_codecs:[],
              min_bitrate_kbps:'',
              bitrate_ceiling:{ enabled:true, sd:1500, hd:3000,
                                fullhd:6000, uhd:18000 } } };
}

// Which library is being edited, or null when creating a new one.
let editingId = null;

function draftFromLibrary(lib) {
  const d = blankDraft();
  const p = lib.profile || {};
  Object.assign(d, {
    name: lib.name || '',
    watch_path: lib.watch_path || '',
    output_path: lib.output_path || '',
    original_action: lib.original_action || 'archive',
  });
  // Only copy keys the wizard knows about, and never overwrite a default
  // with an empty value — older libraries are missing newer settings.
  for (const key of Object.keys(d)) {
    if (key in p && p[key] !== null && p[key] !== undefined && p[key] !== '')
      d[key] = p[key];
  }
  if (!Array.isArray(d.auto_retry_steps)) d.auto_retry_steps = ['small','smaller'];
  if (!Array.isArray(d.audio_languages_list)) d.audio_languages_list = ['eng'];
  if (!Array.isArray(d.subtitle_languages)) d.subtitle_languages = ['eng'];
  d.filters = {...d.filters, ...(lib.filters || {})};
  d.filters.bitrate_ceiling = {
    ...blankDraft().filters.bitrate_ceiling,
    ...((lib.filters || {}).bitrate_ceiling || {})};
  d.naming = {...d.naming, ...(lib.naming || {})};
  return d;
}

async function openWizard(libId) {
  CAT = CAT || await (await fetch('/api/catalog')).json();
  step = 0;
  returnTo = null;
  editingId = libId != null ? libId : null;

  if (editingId != null) {
    const lib = ((window.__state || {}).libraries || [])
      .find(l => l.id === editingId);
    if (!lib) return alert('Could not find that library.');
    draft = draftFromLibrary(lib);
  } else {
    draft = blankDraft();
  }
  document.getElementById('veil').classList.add('open');
  drawStep();
}

function closeWizard() { document.getElementById('veil').classList.remove('open'); }

function opt(list, key, extra = '') {
  const current = key === 'naming_scheme_proxy' ? draft.naming.scheme : draft[key];
  return list.map(o => `
    <label class="choice ${current === o.id ? 'sel' : ''}"
           onclick="pick('${key}','${o.id}')">
      <div class="t">${o.name}
        ${o.also ? `<span class="alt">(${o.also})</span>` : ''}
        ${o.recommended ? '<span class="badge">recommended</span>' : ''}</div>
      ${o.summary ? `<div class="d">${o.summary}</div>` : ''}
      ${o.detail ? `<div class="w">${o.detail}</div>` : ''}
      ${o.when ? `<div class="d">${o.when}</div>` : ''}
    </label>`).join('') + extra;
}

function pick(key, val) {
  if (key === 'naming_scheme_proxy') {
    draft.naming.scheme = val;
    drawStep();
    return;
  }
  draft[key] = val;
  if (key === 'audio_codec') {
    const a = CAT.audio.find(x => x.id === val);
    draft.audio_bitrate = a?.default_bitrate || '';
  }
  drawStep();
}
function setField(key, val) { draft[key] = val; }

function bar() {
  return `<div class="steps">${STEPS.map((label, i) =>
    `<i class="${i <= step ? 'on' : ''}" title="${label}"
        onclick="jumpTo(${i})"></i>`).join('')}</div>`;
}

// Where the wizard should return to after a detour. Set when you jump from
// the review step, so one edit doesn't mean paging forward through the rest.
let returnTo = null;

function jumpTo(target) {
  if (target === step) return;
  wizardError('');
  // Leaving the first step still has to pass its checks, since everything
  // after it depends on the folders being valid.
  if (step === 0 && target > 0 && !validateFirstStep()) return;
  if (step === STEPS.length - 1) returnTo = step;
  step = target;
  drawStep();
}

function backToReview() {
  if (step === 0 && !validateFirstStep()) return;
  step = returnTo;
  returnTo = null;
  drawStep();
}

async function drawStep() {
  const w = document.getElementById('wiz');
  let body = '', lead = '';

  if (step === 0) {
    lead = 'Give this library a name, then tell Forge which folder to watch.';
    body = `
      <label class="fld"><span>Library name</span>
        <em>Just for you — "Movies", "TV", "Anime". ${
          (() => {
            const others = (window.__state && window.__state.libraries || [])
              .filter(l => l.id !== editingId).map(l => l.name);
            return others.length ? 'Already used: ' + others.join(', ') + '.' : '';
          })()}</em>
        <input type="text" value="${draft.name}" placeholder="Movies"
               oninput="setField('name',this.value)"></label>
      <label class="fld"><span>Folder to watch</span>
        <em>Drop new files here. Forge checks it every 30 seconds and picks up
            anything that finished copying.</em>
        <input type="text" value="${draft.watch_path}"
               placeholder="/media/inbox/movies"
               oninput="setField('watch_path',this.value)"></label>
      <label class="fld"><span>Folder to move finished files to</span>
        <em>Where the converted file ends up. Leave this empty to convert files
            right where they are, without moving them.</em>
        <input type="text" value="${draft.output_path}"
               placeholder="/media/Movies  (optional)"
               oninput="setField('output_path',this.value)"></label>`;
  }

  if (step === 1) {
    lead = 'How should the picture be compressed?';
    const q = `<div style="margin-top:22px"><div style="font-size:13px;font-weight:600;
        margin-bottom:3px">Quality</div>
      <em style="display:block;font-style:normal;font-size:12px;color:var(--muted);
        margin-bottom:9px;line-height:1.5">Higher quality means bigger files. Balanced
        is what most people want.</em>
      ${CAT.quality.map(o => `<label class="choice ${draft.quality_level===o.id?'sel':''}"
        onclick="pick('quality_level','${o.id}')">
        <div class="t">${o.name}${o.recommended?'<span class="badge">recommended</span>':''}</div>
        <div class="w">${o.detail}</div></label>`).join('')}
      <div style="font-size:13px;font-weight:600;margin:22px 0 3px">File type</div>
      <em style="display:block;font-style:normal;font-size:12px;color:var(--muted);
        margin-bottom:9px;line-height:1.5">The wrapper around the video — this is the
        file extension you'll see.</em>
      ${opt(CAT.containers,'container')}</div>`;
    body = opt(CAT.video, 'video_codec') + q;
  }

  if (step === 2) {
    lead = 'HDR films carry brighter highlights and richer colour. Whether to '
         + 'keep that depends on what you watch on.';
    body = opt(CAT.hdr, 'hdr_mode') + `
      <div style="font-size:13px;font-weight:600;margin:22px 0 3px">Colour depth</div>
      <em style="display:block;font-style:normal;font-size:12px;color:var(--muted);
        margin-bottom:9px;line-height:1.5">10-bit shows smoother gradients in
        skies and dark scenes. 8-bit plays on older hardware. With
        <b>Match the original</b>, each file is decided as it is converted:
        if producing 10-bit would drop that machine off its hardware encoder
        and take many times longer, Forge uses 8-bit for that file and says
        so in the queue. Choosing 8-bit or 10-bit outright is always
        obeyed.</em>
      ${opt(CAT.depth, 'bit_depth')}
      <div class="toggle ${draft.tag_colours ? 'on' : ''}"
           onclick="draft.tag_colours=!draft.tag_colours;drawStep()">
        <div class="sw"></div>
        <div><div class="tt">Label colours correctly in the output</div>
          <div class="td">Stops films looking washed out or overly dark on
            players that guess wrongly. Costs nothing — leave this on unless
            you have a reason not to.</div></div>
      </div>`;
  }

  if (step === 3) {
    lead = 'How should the sound be handled?';
    const a = CAT.audio.find(x => x.id === draft.audio_codec);
    const rates = (a?.bitrates || []).length ? `
      <label class="fld" style="margin-top:20px"><span>Audio quality</span>
        <em>Higher numbers sound better and take more space. 160k is plenty for
            most stereo, 640k for surround.</em>
        <select onchange="setField('audio_bitrate',this.value)">
          ${a.bitrates.map(b => `<option ${draft.audio_bitrate===b?'selected':''}>${b}</option>`).join('')}
        </select></label>` : '';
    body = opt(CAT.audio, 'audio_codec') + rates;
  }

  if (step === 4) {
    lead = 'What should happen to subtitle tracks?';
    const langs = draft.subtitle_mode === 'languages' ? `
      <label class="fld" style="margin-top:18px"><span>Languages to keep</span>
        <em>Three-letter codes, separated by commas. eng = English,
            jpn = Japanese, spa = Spanish.</em>
        <input type="text" value="${(draft.subtitle_languages||[]).join(', ')}"
          placeholder="eng, jpn"
          oninput="draft.subtitle_languages=this.value.split(',').map(s=>s.trim()).filter(Boolean)">
      </label>` : '';
    body = opt(CAT.subtitles, 'subtitle_mode') + langs;
  }

  if (step === 5) {
    lead = 'Which tracks survive, and in what order.';
    body = `
      <label class="fld"><span>Preferred audio languages</span>
        <em>Three-letter codes in order of preference, separated by commas.
            These get moved to the front so they play by default.
            eng = English, jpn = Japanese, spa = Spanish.</em>
        <input type="text" value="${(draft.audio_languages_list||[]).join(', ')}"
          placeholder="eng, jpn"
          oninput="draft.audio_languages_list=splitList(this.value)"></label>

      ${opt(CAT.audio_languages, 'audio_language_mode')}

      <div class="toggle ${draft.remove_images ? 'on' : ''}" style="margin-top:20px"
           onclick="draft.remove_images=!draft.remove_images;drawStep()">
        <div class="sw"></div>
        <div><div class="tt">Remove embedded cover art and thumbnails</div>
          <div class="td">Posters tucked inside a video file confuse encoders
            and are the usual reason one file in a batch fails. Leave this on.</div></div>
      </div>

      <div class="toggle ${draft.keep_forced_subs ? 'on' : ''}"
           onclick="draft.keep_forced_subs=!draft.keep_forced_subs;drawStep()">
        <div class="sw"></div>
        <div><div class="tt">Always keep forced subtitles</div>
          <div class="td">Forced subtitles translate the parts of a film spoken
            in another language — Klingon, Elvish, a scene in Spanish. This keeps
            them even when you're removing subtitles otherwise.</div></div>
      </div>

      <div class="toggle ${draft.tidy_track_names ? 'on' : ''}"
           onclick="draft.tidy_track_names=!draft.tidy_track_names;drawStep()">
        <div class="sw"></div>
        <div><div class="tt">Name the tracks properly</div>
          <div class="td">Labels each track with its language and layout \u2014
            "English 5.1", "Spanish Stereo", "German 7.1" \u2014 instead of
            leaving your player to show "Track 1". Commentary, forced and
            hearing-impaired tracks are marked as such, and a missing language
            tag is filled in when the old title makes it obvious.</div></div>
      </div>

      <div class="toggle ${draft.default_first_subtitle ? 'on' : ''}"
           onclick="draft.default_first_subtitle=!draft.default_first_subtitle;drawStep()">
        <div class="sw"></div>
        <div><div class="tt">Turn the first subtitle track on by default</div>
          <div class="td">Subtitles appear without you switching them on. Most
            people want this off, since forced subtitles show up regardless.</div></div>
      </div>`;
  }

  if (step === 6) {
    lead = 'Downloads arrive with names full of codec and quality tags. '
         + 'Forge can rewrite them into the layout your media server expects.';
    const n = draft.naming;
    body = `
      <div class="toggle ${n.enabled ? 'on' : ''}"
           onclick="draft.naming.enabled=!draft.naming.enabled;drawStep()">
        <div class="sw"></div>
        <div><div class="tt">Rename files automatically</div>
          <div class="td">Turn moviename1_H264_mkv_DUALAUDIO_subrip_1080p.mkv
            into Moviename1 (2024)/Moviename1 (2024).mkv.</div></div>
      </div>
      ${n.enabled ? `
        ${opt(CAT.naming, 'naming_scheme_proxy')}
        <div class="toggle ${n.folders ? 'on' : ''}"
             onclick="draft.naming.folders=!draft.naming.folders;drawStep()">
          <div class="sw"></div>
          <div><div class="tt">Put each film in its own folder</div>
            <div class="td">All three servers expect this, and it keeps
              posters and subtitles beside the film they belong to.</div></div>
        </div>
        <div class="toggle ${n.skip_uncertain ? 'on' : ''}"
             onclick="draft.naming.skip_uncertain=!draft.naming.skip_uncertain;drawStep()">
          <div class="sw"></div>
          <div><div class="tt">Leave the name alone if unsure</div>
            <div class="td">If there's no year or episode number to go on,
              Forge is guessing. With this on it keeps the original name
              rather than inventing a wrong one.</div></div>
        </div>
        <div style="font-size:13px;font-weight:600;margin:22px 0 3px">Preview</div>
        <em style="display:block;font-style:normal;font-size:12px;
          color:var(--muted);margin-bottom:9px;line-height:1.5">Using real files
          from your watch folder where possible. Check these look right before
          continuing.</em>
        <div id="namepreview" class="review"
             style="font-family:'Chivo Mono',monospace;font-size:11.5px;
                    line-height:1.7">Loading…</div>` : ''}`;
    if (n.enabled) setTimeout(refreshPreview, 0);
  }

  if (step === 7) {
    lead = 'A few finishing touches.';
    body = `
      <div class="toggle ${draft.keep_chapters ? 'on' : ''}"
           onclick="draft.keep_chapters=!draft.keep_chapters;drawStep()">
        <div class="sw"></div>
        <div><div class="tt">Keep chapter markers</div>
          <div class="td">Chapters drive skip-intro and scene selection in most
            players. They cost nothing to keep.</div></div>
      </div>

      <div class="toggle ${draft.clean_metadata ? 'on' : ''}"
           onclick="draft.clean_metadata=!draft.clean_metadata;drawStep()">
        <div class="sw"></div>
        <div><div class="tt">Clear out embedded titles and tags</div>
          <div class="td">Release groups write their own name into the file's
            title field, which some players show instead of the film's name.
            This wipes it.</div></div>
      </div>

      <label class="fld" style="margin-top:20px"><span>Surround sound</span>
        <em>What to do with 5.1 and 7.1 audio.</em>
        <select onchange="draft.downmix=this.value">
          <option value="" ${!draft.downmix ? 'selected' : ''}>Keep surround as it is</option>
          <option value="stereo" ${draft.downmix === 'stereo' ? 'selected' : ''}>Fold down to stereo</option>
        </select></label>

      <div class="toggle ${draft.normalise_loudness ? 'on' : ''}"
           onclick="draft.normalise_loudness=!draft.normalise_loudness;drawStep()">
        <div class="sw"></div>
        <div><div class="tt">Even out the volume</div>
          <div class="td">Stops you reaching for the remote between quiet
            dialogue and loud action. Requires re-encoding the audio, so it
            can't be combined with leaving audio alone.</div></div>
      </div>`;
  }

  if (step === 8) {
    const f = draft.filters;
    const csv = v => (v || []).join(', ');
    lead = "Anything matching these is left alone entirely — it won't be queued, " +
           "and Forge won't ask again. Leave any of them blank to ignore that rule.";
    body = `
      <label class="fld"><span>Skip these file types</span>
        <em>File extensions to ignore, separated by commas. Handy if you only
            want to convert old AVI files and leave your MP4s alone.</em>
        <input type="text" value="${csv(f.skip_extensions)}" placeholder="mp4, m4v"
          oninput="draft.filters.skip_extensions=splitList(this.value)"></label>

      <label class="fld"><span>Ignore files already in these formats</span>
        <em>Video formats to skip entirely, separated by commas. Note this skips
            the file completely, including its audio — if you download H.265 files
            that still need their audio converted, leave this blank and use the
            setting further down instead.</em>
        <input type="text" value="${csv(f.skip_video_codecs)}" placeholder="hevc, av1"
          oninput="draft.filters.skip_video_codecs=splitList(this.value)"></label>

      <label class="fld"><span>Skip files with these words in the name</span>
        <em>Comma separated, not case sensitive. Common ones: sample, trailer, extras.</em>
        <input type="text" value="${csv(f.skip_name_contains)}"
          placeholder="sample, trailer"
          oninput="draft.filters.skip_name_contains=splitList(this.value)"></label>

      <div class="pair">
        <label class="fld"><span>Skip if smaller than</span>
          <em>Megabytes. Filters out clips and extras.</em>
          <input type="text" value="${f.min_size_mb}" placeholder="200"
            oninput="draft.filters.min_size_mb=this.value"></label>
        <label class="fld"><span>Skip if larger than</span>
          <em>Megabytes. Leave huge remuxes alone.</em>
          <input type="text" value="${f.max_size_mb}" placeholder="40000"
            oninput="draft.filters.max_size_mb=this.value"></label>
      </div>

      <div class="toggle ${f.bitrate_ceiling.enabled ? 'on' : ''}"
           onclick="toggleCeiling()" style="margin:22px 0 14px">
        <div class="sw"></div>
        <div><div class="tt">Leave the picture alone if it's already small enough</div>
          <div class="td">When a file is already in your chosen video format
            <em style="font-style:normal;color:var(--text)">and</em> under these
            sizes, Forge keeps the original picture untouched and only fixes the
            audio. Much faster, and no quality is lost. A file over the limit gets
            properly re-converted even if it's already the right format.</div></div>
      </div>

      ${f.bitrate_ceiling.enabled ? `
      <label class="fld"><span>Size limits by resolution</span>
        <em>In kbps. A number that's generous for 720p is stingy for 4K, so each
            resolution gets its own limit. The defaults suit most libraries.</em>
        <div class="pair">
          <label class="fld" style="margin:0"><span style="font-size:12px">SD</span>
            <input type="text" value="${f.bitrate_ceiling.sd ?? 1500}"
              oninput="draft.filters.bitrate_ceiling.sd=this.value"></label>
          <label class="fld" style="margin:0"><span style="font-size:12px">720p</span>
            <input type="text" value="${f.bitrate_ceiling.hd ?? 3000}"
              oninput="draft.filters.bitrate_ceiling.hd=this.value"></label>
        </div>
        <div class="pair" style="margin-top:9px">
          <label class="fld" style="margin:0"><span style="font-size:12px">1080p</span>
            <input type="text" value="${f.bitrate_ceiling.fullhd ?? 6000}"
              oninput="draft.filters.bitrate_ceiling.fullhd=this.value"></label>
          <label class="fld" style="margin:0"><span style="font-size:12px">4K</span>
            <input type="text" value="${f.bitrate_ceiling.uhd ?? 18000}"
              oninput="draft.filters.bitrate_ceiling.uhd=this.value"></label>
        </div>
      </label>` : ''}

      <label class="fld"><span>Ignore files under this bitrate completely</span>
        <em>In kbps. Unlike the setting above, these are skipped outright — the
            audio won't be touched either. Leave blank unless you want that.</em>
        <input type="text" value="${f.min_bitrate_kbps || ''}" placeholder="800"
          oninput="draft.filters.min_bitrate_kbps=this.value"></label>

      <div class="pair">
        <label class="fld"><span>Skip if shorter than</span>
          <em>Minutes.</em>
          <input type="text" value="${f.min_minutes}" placeholder="5"
            oninput="draft.filters.min_minutes=this.value"></label>
        <label class="fld"><span>Skip if longer than</span>
          <em>Minutes.</em>
          <input type="text" value="${f.max_minutes}" placeholder="240"
            oninput="draft.filters.max_minutes=this.value"></label>
      </div>`;
  }

  if (step === 9) {
    lead = 'Once a file has been converted, what should happen to the original?';
    const keeping = draft.original_action === 'archive';
    body = opt(CAT.originals, 'original_action') + `
      ${keeping ? `
        <label class="fld" style="margin-top:18px">
          <span>Where to keep them</span>
          <em>Leave blank and they go into an Originals folder beside the
              destination \u2014 or inside the watched folder when converting
              in place, which is wrong if that folder is a library your media
              server scans. Give a separate path to keep them out of the way.</em>
          <input type="text" value="${draft.originals_path || ''}"
            placeholder="${draft.output_path ? 'optional' : '/originals'}"
            oninput="draft.originals_path=this.value"></label>` : ''}
      <div class="${keeping ? 'review' : 'warn'}"
           style="${keeping ? 'font-size:12.5px;color:var(--muted);margin-top:6px' : ''}">
        ${keeping
          ? 'Keeping originals also lets Forge undo a conversion that came out '
            + 'bigger than the file it started from, and try again at a smaller '
            + 'setting. That is the next step.'
          : 'Heads up: with this setting there is no original to fall back on, '
            + 'so the size checks on the next step are unavailable. If a file '
            + 'comes out bigger, Forge can only tell you about it \u2014 it '
            + 'cannot put the original back or convert it again.'}
      </div>`;
  }

  if (step === 10) {
    lead = 'Sometimes a converted file comes out bigger than the original \u2014 '
         + 'usually with animation or anything already well compressed.';
    const keepsOriginals = draft.original_action === 'archive';
    const steps = (CAT.retry_steps || []).filter(x => x.id !== 'custom');
    const chosen = draft.auto_retry_steps || [];
    body = `
      <label class="fld" style="${keepsOriginals ? '' : 'opacity:.45'}">
        <span>How much smaller is worth it? (a percentage)</span>
        <em>This is checked <b>after</b> a file is converted, against the
            result. A file that comes out bigger is always rejected \u2014 that
            part is never optional. This adds a stricter bar on top: leave it
            blank to accept any saving at all, or enter 10 to also reject a file
            that only shrank 3%, on the grounds that it isn't worth
            re-encoding for.</em>
        <input type="text" value="${draft.min_saving_percent}" placeholder="any saving"
          ${keepsOriginals ? '' : 'disabled'}
          oninput="draft.min_saving_percent=this.value"></label>

      ${keepsOriginals ? '' : `<div class="warn">
        <b>These options need originals kept.</b><br>
        This library is set to
        "${(CAT.originals.find(o => o.id === draft.original_action) || {}).name}",
        so once a file is converted the source is gone. Forge can still tell you
        a file came out bigger, but it cannot put the original back, convert it
        again, or keep the original picture \u2014 all of which need the source.
        <br><br>
        <span onclick="jumpTo(9)" style="color:var(--signal);cursor:pointer;
              text-decoration:underline">Change that on the previous step</span>
        to switch to "Move it to an Originals folder".</div>`}

      <div class="toggle ${draft.auto_retry && keepsOriginals ? 'on' : ''}"
           onclick="${keepsOriginals
             ? 'draft.auto_retry=!draft.auto_retry;drawStep()' : ''}"
           style="${keepsOriginals ? '' : 'opacity:.5;cursor:default'}">
        <div class="sw"></div>
        <div><div class="tt">Try again automatically at a smaller setting</div>
          <div class="td">Forge puts the original back and works down the
            settings below until one actually saves space. No button pressing.</div></div>
      </div>

      ${draft.auto_retry && keepsOriginals ? `
        <label class="fld"><span>Settings to work through, in order</span>
          <em>These are picture quality settings \u2014 how hard to compress on
              each retry. Forge stops at the first one that actually saves
              space, then checks the result against the percentage above.</em>
          ${steps.map(st => `
            <div class="toggle ${chosen.includes(st.id) ? 'on' : ''}"
                 onclick="toggleRetryStep('${st.id}')">
              <div class="sw"></div>
              <div><div class="tt">${st.name}</div>
                <div class="td">${st.detail}</div></div>
            </div>`).join('')}
          <div class="toggle ${chosen.includes('custom') ? 'on' : ''}"
               onclick="toggleRetryStep('custom')">
            <div class="sw"></div>
            <div><div class="tt">And a setting of my own</div>
              <div class="td">A last resort if none of the above work.</div></div>
          </div>
          ${chosen.includes('custom') ? `
            <div style="margin-top:11px">
              <div style="font-size:12.5px;color:var(--muted);line-height:1.55;
                          margin-bottom:8px">
                This is a picture quality setting, not a percentage. Lower
                keeps more detail and makes bigger files; higher compresses
                harder. Forge only reaches this after the steps above have
                already failed, so pick something well below them.
              </div>
              <select onchange="draft.auto_retry_custom=this.value">
                <option value="">Choose a quality\u2026</option>
                ${(CAT.quality_scale || []).map(q =>
                  `<option value="${q.value}" ${String(draft.auto_retry_custom)
                    === String(q.value) ? 'selected' : ''}>${q.name} \u2014 ${q.detail}</option>`
                ).join('')}
              </select>
            </div>` : ''}
        </label>
        <div class="review" style="font-size:12.5px;color:var(--muted);
             line-height:1.6;margin:4px 0 16px">
          The two settings on this step do different jobs: the ones above
          decide <b>how</b> to convert on each retry, the percentage decides
          <b>whether the result was worth keeping</b>.
        </div>

        <div class="toggle ${draft.salvage_when_stuck ? 'on' : ''}"
             onclick="draft.salvage_when_stuck=!draft.salvage_when_stuck;drawStep()">
          <div class="sw"></div>
          <div><div class="tt">If nothing helps, keep the original picture
            and finish the rest</div>
            <div class="td">Some files are already as small as they sensibly
              get. Rather than leaving them in the inbox, Forge keeps the
              picture exactly as it is and still fixes the audio, tidies the
              tracks, renames the file and files it away. Nothing is
              re-encoded, so no quality is lost.</div></div>
        </div>
        ${draft.salvage_when_stuck ? '' : `<div class="review"
          style="font-size:12.5px;color:var(--muted)">With this off, a file
          that can't be shrunk stays in the watch folder and is listed under
          "Got bigger" for you to deal with.</div>`}` : ''}`;
  }

  if (step === 11) {
    const warns = (await (await fetch('/api/profile/check', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(draft)})).json()).warnings || [];
    const n = (list, key) =>
      (CAT[list].find(x => x.id === draft[key]) || {}).name || draft[key];

    lead = editingId != null
      ? 'Tap any line to change it, then save.'
      : 'Check this over, then start watching. Tap any line to change it.';

    const rows = [
      [0, 'Name', draft.name || '—'],
      [0, 'Watches', draft.watch_path || '—'],
      [0, 'Moves to', draft.output_path || 'stays in the watch folder'],
      [1, 'Video', `${n('video','video_codec')}, ${n('quality','quality_level')}`],
      [1, 'File type', n('containers','container')],
      [2, 'Colour', `${n('hdr','hdr_mode')}, ${n('depth','bit_depth')}`],
      [3, 'Audio', n('audio','audio_codec')
          + (draft.audio_bitrate ? ' at ' + draft.audio_bitrate : '')],
      [4, 'Subtitles', n('subtitles','subtitle_mode')
          + (draft.subtitle_mode === 'languages'
             ? ' (' + (draft.subtitle_languages || []).join(', ') + ')' : '')],
      [5, 'Track order', ((draft.audio_languages_list || []).join(', ') || 'as-is')
          + (draft.audio_language_mode === 'preferred_only'
             ? ' (others removed)' : '')
          + (draft.tidy_track_names ? ', tracks named by language' : '')],
      [6, 'Naming', draft.naming.enabled
          ? ((CAT.naming.find(x => x.id === draft.naming.scheme) || {}).name
             || draft.naming.scheme) + ' layout'
          : 'keep original names'],
      [7, 'Extras', [
            draft.keep_chapters ? 'chapters kept' : 'chapters dropped',
            draft.clean_metadata ? 'tags cleared' : null,
            draft.downmix === 'stereo' ? 'stereo downmix' : null,
            draft.normalise_loudness ? 'volume levelled' : null,
          ].filter(Boolean).join(', ')],
      [8, 'Skipping', describeFilters()],
      [9, 'Originals', n('originals','original_action')
          + (draft.originals_path ? ` in ${draft.originals_path}` : '')],
      [10, 'Size check', (draft.min_saving_percent
            ? `must save ${draft.min_saving_percent}%` : 'must come out smaller')
          + (draft.auto_retry && draft.original_action === 'archive'
             ? ', retries automatically' : '')
          + (draft.salvage_when_stuck && draft.original_action === 'archive'
             ? ', keeps the picture if nothing helps' : '')],
    ];

    body = warns.map(x => `<div class="warn">${x}</div>`).join('')
      + rows.map(([target, label, value]) => `
        <div class="review-row" onclick="jumpTo(${target})">
          <b>${label}</b>
          <span class="val">${value}</span>
          <span class="edit">change</span>
        </div>`).join('');
  }

  const heading = editingId != null && step === 0
    ? `Editing ${draft.name || 'library'}` : STEPS[step];
  w.innerHTML = `<h3>${heading}</h3><p class="lead">${lead}</p>${bar()}${body}
    <div class="wiz-nav">
      <button onclick="closeWizard()">Cancel</button>
      <span class="grow"></span>
      ${step > 0 ? '<button onclick="step--;drawStep()">Back</button>' : ''}
      ${returnTo != null && step !== returnTo
        ? '<button class="primary" onclick="backToReview()">Back to review</button>'
        : step < STEPS.length - 1
          ? '<button class="primary" onclick="nextStep()">Continue</button>'
          : `<button class="primary" onclick="saveLibrary()">${
              editingId != null ? 'Save changes' : 'Start watching'}</button>`}
    </div>`;
  w.scrollTop = 0;
}

function toggleRetryStep(id) {
  if (!Array.isArray(draft.auto_retry_steps)) draft.auto_retry_steps = [];
  const list = draft.auto_retry_steps;
  const at = list.indexOf(id);
  if (at >= 0) list.splice(at, 1); else list.push(id);
  drawStep();
}

function toggleCeiling() {
  draft.filters.bitrate_ceiling.enabled = !draft.filters.bitrate_ceiling.enabled;
  drawStep();
}

const SAMPLE_NAMES = [
  'moviename1_H264_mkv_DUALAUDIO_subrip_1080p.mkv',
  'Wrath.of.Man.2021.1080p.BluRay.x265.10bit.DTS-HD.MA.7.1-GROUP.mkv',
  'Breaking.Bad.S01E01.Pilot.1080p.BluRay.x264-DEMAND.mkv',
];

async function refreshPreview() {
  const el = document.getElementById('namepreview');
  if (!el) return;
  let names = [];
  try {
    const r = await (await fetch('/api/naming/samples?limit=5')).json();
    names = r.names || [];
  } catch (e) { /* fall back to examples */ }
  if (names.length < 3) names = names.concat(SAMPLE_NAMES).slice(0, 5);

  const res = await (await fetch('/api/naming/preview', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({names, scheme: draft.naming.scheme,
      container: draft.container, folders: draft.naming.folders})})).json();

  const rows = (res.results || []).map(r => {
    const unsure = !r.confident && draft.naming.skip_uncertain;
    const badge = r.looked_up
      ? '<span style="color:var(--signal);opacity:.7"> · matched online</span>'
      : '';
    return `<div style="margin-bottom:11px">
      <div style="color:var(--muted)">${r.original}</div>
      <div style="color:${unsure ? 'var(--amber)' : 'var(--signal)'}">
        ${unsure ? 'left as-is — not enough to go on' : r.path}${badge}</div>
    </div>`;
  }).join('');
  const hint = res.used_lookup ? '' :
    `<div style="color:var(--amber);margin-bottom:12px">Names are being worked
     out from the filename alone. Turn on online lookup in Settings to confirm
     them against a database.</div>`;
  el.innerHTML = hint + (rows || 'No files to preview.');
}

function splitList(v) {
  return v.split(',').map(x => x.trim()).filter(Boolean);
}

function describeFilters() {
  const f = draft.filters, out = [];
  if (f.skip_extensions.length) out.push(f.skip_extensions.join('/') + ' files');
  if (f.skip_video_codecs.length) out.push('anything already ' + f.skip_video_codecs.join('/'));
  if (f.min_bitrate_kbps) out.push('under ' + f.min_bitrate_kbps + ' kbps');
  if (f.bitrate_ceiling && f.bitrate_ceiling.enabled)
    out.push('re-encodes only above ' + f.bitrate_ceiling.fullhd + ' kbps at 1080p');
  if (f.skip_name_contains.length) out.push('names with ' + f.skip_name_contains.join('/'));
  if (f.min_size_mb) out.push('under ' + f.min_size_mb + ' MB');
  if (f.max_size_mb) out.push('over ' + f.max_size_mb + ' MB');
  if (f.min_minutes) out.push('under ' + f.min_minutes + ' min');
  if (f.max_minutes) out.push('over ' + f.max_minutes + ' min');
  return out.length ? out.join(', ') : 'nothing — every video is converted';
}

function validateFirstStep() {
  wizardError('');
  const name = draft.name.trim();
  if (!name) { wizardError('Give the library a name.'); return false; }
  if (!draft.watch_path.trim()) {
    wizardError('Pick a folder to watch.'); return false;
  }
  const taken = (window.__state && window.__state.libraries || [])
    .some(l => l.id !== editingId && l.name.toLowerCase() === name.toLowerCase());
  if (taken) {
    wizardError(`A library called "${name}" already exists.`); return false;
  }
  const out = draft.output_path.trim();
  if (out && out === draft.watch_path.trim()) {
    wizardError('The watch folder and destination are the same. '
      + 'Leave the destination empty to convert files where they are.');
    return false;
  }
  if (out && out.startsWith(draft.watch_path.trim().replace(/\/$/, '') + '/')) {
    wizardError('The destination is inside the watch folder, so converted '
      + 'files would be picked up and converted again.');
    return false;
  }
  return true;
}

function nextStep() {
  if (step === 0 && !validateFirstStep()) return;
  step++;
  drawStep();
}

function wizardError(message) {
  const nav = document.querySelector('.wiz-nav');
  const existing = document.getElementById('wizerr');
  if (existing) existing.remove();
  if (!nav || !message) return;
  const box = document.createElement('div');
  box.id = 'wizerr';
  box.className = 'warn';
  box.style.borderColor = 'rgba(255,107,107,.4)';
  box.style.background = 'rgba(255,107,107,.12)';
  box.style.color = '#ffb4b4';
  box.textContent = message;
  nav.parentNode.insertBefore(box, nav);
  box.scrollIntoView({block:'nearest'});
}

async function saveLibrary() {
  const body = {
    name: draft.name.trim(),
    watch_path: draft.watch_path.trim(),
    output_path: draft.output_path.trim() || null,
    original_action: draft.original_action,
    originals_path: draft.originals_path.trim() || null,
    profile: {
      video_codec: draft.video_codec, container: draft.container,
      quality_level: draft.quality_level, audio_codec: draft.audio_codec,
      audio_bitrate: draft.audio_bitrate, subtitle_mode: draft.subtitle_mode,
      subtitle_languages: draft.subtitle_languages,
      hdr_mode: draft.hdr_mode, bit_depth: draft.bit_depth,
      tag_colours: draft.tag_colours,
      audio_language_mode: draft.audio_language_mode,
      audio_languages_list: draft.audio_languages_list,
      remove_images: draft.remove_images,
      keep_forced_subs: draft.keep_forced_subs,
      default_first_subtitle: draft.default_first_subtitle,
      keep_chapters: draft.keep_chapters, clean_metadata: draft.clean_metadata,
      tidy_track_names: draft.tidy_track_names,
      downmix: draft.downmix, normalise_loudness: draft.normalise_loudness,
      min_saving_percent: draft.min_saving_percent,
      salvage_when_stuck: draft.salvage_when_stuck,
      auto_retry: draft.auto_retry,
      auto_retry_steps: draft.auto_retry_steps,
      auto_retry_custom: draft.auto_retry_custom,
    },
    naming: draft.naming,
    filters: draft.filters,
  };
  wizardError('');
  const editing = editingId != null;
  let r;
  try {
    r = await fetch(editing ? `/api/libraries/${editingId}` : '/api/libraries',
      {method: editing ? 'PATCH' : 'POST',
       headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  } catch (e) {
    return wizardError('Could not reach the server.');
  }
  if (!r.ok) {
    let detail = 'Could not save that.';
    try { detail = (await r.json()).detail || detail; } catch (e) {}
    // Naming and folder problems come from the first step, so go back to it.
    if (/name|folder|destination|watch/i.test(detail)) {
      step = 0;
      drawStep();
      setTimeout(() => wizardError(detail), 0);
    } else {
      wizardError(detail);
    }
    return;
  }
  const wasEditing = editingId;
  closeWizard();
  // New settings only apply to files found from now on, so nudge a scan
  // rather than waiting up to the full interval.
  if (wasEditing != null) fetch(`/api/libraries/${wasEditing}/scan`, {method:'POST'});
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeWizard();
});

async function scanRoots() {
  const r = await fetch('/api/scan', { method: 'POST' });
  const d = await r.json();
  alert(`Scanned ${d.scanned} files.`);
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => {
    document.getElementById('dot').classList.add('live');
    document.getElementById('conn').textContent = 'live';
  };
  ws.onmessage = e => render(JSON.parse(e.data));
  ws.onclose = () => {
    document.getElementById('dot').classList.remove('live');
    document.getElementById('conn').textContent = 'reconnecting';
    setTimeout(connect, 3000);
  };
}
connect();
</script>
