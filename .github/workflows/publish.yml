# Builds the server and worker images and publishes them to GitHub's
# container registry, so they can be pulled with a ghcr.io address.
#
# Nothing to configure: GITHUB_TOKEN is provided automatically and has
# permission to push to your own packages.
#
# Images produced:
#   ghcr.io/<you>/forge:latest          the server
#   ghcr.io/<you>/forge-worker:latest   the worker
#
# Tag a release (git tag v1.0.0 && git push --tags) and you also get
# :v1.0.0, :1.0 and :1 for pinning.

name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: forge
            context: ./server
          - name: forge-worker
            context: ./worker

    steps:
      - uses: actions/checkout@v4

      # Needed to build arm64 images on an amd64 runner. Synology boxes are
      # usually amd64; Raspberry Pis and Apple Silicon are arm64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
